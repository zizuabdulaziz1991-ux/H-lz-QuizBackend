databases:
  - name: hizliquiz-db
    plan: free          # Prod'da basic_256mb ve ustune cikarin (free DB 30 gun sonra silinir)
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: hizliquiz-backend
    runtime: docker
    region: frankfurt
    plan: free          # Free planda bosta uyur; mobil icin starter onerilir
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hizliquiz-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://hizliquiz-frontend.onrender.com   # Mobil uygulamalar CORS'a tabi degildir
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hizliquiz-backend.onrender.com
